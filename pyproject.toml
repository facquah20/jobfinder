[project]
name = "jobfinder"
version = "0.1.0"
description = "Configurable job discovery and career-page crawler"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.6",
    "tenacity>=8.2",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "playwright (>=1.64.1,<2.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
browser = [
    "playwright>=1.40",
]
dashboard = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.scripts]
jobfinder = "job_finder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
job_finder = ["static/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]